name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset:
          - linux-gcc
          - linux-clang
          - linux-gcc-ci
          - linux-clang-asan-ubsan

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libcurl4-openssl-dev

      - name: configure
        run: cmake --preset ${{ matrix.preset }}

      - name: build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: test
        run: ctest --preset ${{ matrix.preset }}

  docs:
    name: docs (doxygen)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libcurl4-openssl-dev \
            doxygen

      - name: generate documentation
        run: cmake --preset linux-docs

  desktop-entry:
    name: desktop entry
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: install desktop-file-utils
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils

      - name: validate
        run: desktop-file-validate resources/io.github.jfcameron.wanikani_reviews_icon.desktop

